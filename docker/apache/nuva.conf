ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot /var/www/nuva/public
    # Conservar las rutas de recursos y enlaces que ya utiliza Nuva.
    Alias /public/ /var/www/nuva/public/
    <Directory /var/www/nuva/public>
        Options -Indexes
        AllowOverride FileInfo AuthConfig Options
        Require all granted
        # PHP mantiene 64 KB en formularios comunes y permite 3 MB solo para fotos.
        LimitRequestBody 3145728
    </Directory>

    # %U registra la ruta sin la consulta: no guarda el código temporal de Google.
    LogFormat "[Nuva acceso] %a %t %m %U %>s %b" nuva
    CustomLog /proc/self/fd/1 nuva
    ErrorLog /proc/self/fd/2
    LogLevel warn
</VirtualHost>
