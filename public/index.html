<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/b86a0d0d2f.js" crossorigin="anonymous"></script>
    <title>Nuva - Inicio</title>
</head>
<body>
    <header>
        <div class="logo__container">
            <img class="logo__img" src="./assets/logo/nuva-main.svg" alt="">
        </div>
        <div class="header__actions">
            <button class="header__btn header__btn--settings">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
    </header>
    <main>
        <section class="hero__container">
            <h1 class="hero__title"></h1>
            <p class="hero__text"></p>
            <a class="hero__btn" href="#"></a>
        </section>
        <section class="stats__container">
            <div class="stats__card">
                <h3 class="stats__qty">12K+</h3>
                <span>Jugadores</span>
            </div>
            <div class="stats__card">
                <h3 class="stats__qty">450+</h3>
                <span>Competiciones</span>
            </div>
        </section>

    </main>
    <nav class="tab-bar">
        <ul class="tab-bar__list">
            <li class="tab-bar__item">
                <a class="tab-bar__link" href="#">
                    <div class="tab-bar__icon-container">
                        <i class="fa-solid fa-house"></i>
                    </div>
                    <span class="tab-bar__text">Home</span>
                </a>
            </li>
            <li class="tab-bar__item">
                <a class="tab-bar__link" href="#">
                    <div class="tab-bar__icon-container">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <span class="tab-bar__text">Competiciones</span>
                </a>
            </li>
            <li class="tab-bar__item">
                <a class="tab-bar__link" href="#">
                    <div class="tab-bar__icon-container">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <span class="tab-bar__text">Cuenta</span>
                </a>
            </li>
    </nav>
</body>
</html>
